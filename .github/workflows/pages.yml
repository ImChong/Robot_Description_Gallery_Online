name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running: a
# half-applied Pages deployment is worse than a slightly stale site, and the
# retries below mean a run can legitimately sit in this group for minutes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Cheap guard: never publish a registry that fails its own invariants or
      # is missing card images.
      - run: npm ci
      - run: node scripts/check_registry.mjs --thumbs

      # The site needs no build step: web/ is already the deployable artifact,
      # and it reads ../data/robots.json, so both directories ship as-is with
      # the root index.html redirecting into web/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r web data _site/
          rm -f _site/data/curation.json
          du -sh _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # The Pages deployment API returns a transient 503 often enough that one
      # attempt is not reliable — two runs failed exactly that way on
      # 2026-08-17 with a green build and a perfectly good artifact.
      # deploy-pages does not retry the create call itself, so the retry lives
      # here; re-running it just creates a fresh deployment from the artifact
      # already uploaded above, which is what the 503 message asks for.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Back off before the second attempt
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # Last attempt, and the only one allowed to fail the job.
      - name: Back off before the final attempt
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: sleep 120
      - id: deploy_final
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
