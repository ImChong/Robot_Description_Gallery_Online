name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Cheap guard: never publish a registry that fails its own invariants or
      # is missing card images.
      - run: npm ci
      - run: node scripts/check_registry.mjs --thumbs

      # The site needs no build step: web/ is already the deployable artifact,
      # and it reads ../data/robots.json, so both directories ship as-is with
      # the root index.html redirecting into web/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r web data _site/
          rm -f _site/data/curation.json
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
