name: Verify registry

# Every entry points at someone else's repository, so the gallery rots when an
# upstream moves a mesh, rewrites history, or takes a repo private. This job
# rebuilds the registry from robot_descriptions.py and loads every robot in a
# real browser, weekly and on any change to the pipeline.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'web/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'web/**'
      # Same list as the push trigger: without this a change to the job itself
      # reaches main having never run.
      - '.github/workflows/verify.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: pip install -r scripts/requirements.txt
      - run: npm ci

      # Regenerating in CI is the actual check: build_registry.py HEAD-probes
      # every mesh, so an upstream that moved files fails here.
      - name: Rebuild registry
        run: python3 scripts/build_registry.py --out /tmp/robots.json

      - name: Compare against the committed registry
        run: |
          python3 - <<'PY'
          import json, sys

          committed = json.load(open('data/robots.json'))
          fresh = json.load(open('/tmp/robots.json'))
          fresh_by_id = {r['id']: r for r in fresh['robots']}

          # Fields that change what the browser loads. Byte counts are reported
          # but never fail the job: a CDN can legitimately report a different
          # Content-Length (compressed variants, for one) without the assets
          # themselves having moved.
          STRUCTURAL_COMMON = [
              ('source', 'commit'), ('source', 'github'),
              ('assets', 'base'), ('formats',),
          ]
          STRUCTURAL_URDF = [
              ('assets', 'urdf'), ('assets', 'packages'),
              ('assets', 'mesh_files'), ('assets', 'mesh_formats'),
              ('assets', 'skip_meshes'), ('assets', 'mesh_alt'),
              ('urdf', 'links'), ('urdf', 'joints'), ('urdf', 'moving_joints'),
          ]
          STRUCTURAL_MJCF = [
              ('assets', 'mjcf'), ('assets', 'mjcf_model'),
              ('assets', 'mesh_files'), ('assets', 'mesh_formats'),
              ('assets', 'skip_meshes'), ('assets', 'mesh_alt'),
              ('mjcf', 'links'), ('mjcf', 'joints'), ('mjcf', 'moving_joints'),
              ('source', 'mjcf_external'),
          ]
          INFORMATIONAL_URDF = [
              ('assets', 'mesh_bytes'), ('urdf', 'mass_kg'), ('urdf', 'bytes'),
          ]
          INFORMATIONAL_MJCF = [
              ('assets', 'mesh_bytes'), ('mjcf', 'mass_kg'), ('mjcf', 'bytes'),
          ]

          def at(entry, path):
              value = entry
              for key in path:
                  value = value.get(key) if isinstance(value, dict) else None
              return value

          drifted = False
          for robot in committed['robots']:
              new = fresh_by_id.get(robot['id'])
              if new is None:
                  print(f"::error::{robot['id']} no longer resolves upstream")
                  drifted = True
                  continue
              structural = STRUCTURAL_COMMON + (
                  STRUCTURAL_URDF if robot.get('urdf') else STRUCTURAL_MJCF
              )
              informational = (
                  INFORMATIONAL_URDF if robot.get('urdf') else INFORMATIONAL_MJCF
              )
              for path in structural:
                  was, now = at(robot, path), at(new, path)
                  if was != now:
                      print(
                          f"::error::{robot['id']} {'.'.join(path)} drifted: "
                          f"{was!r} -> {now!r} — re-run `npm run registry`"
                      )
                      drifted = True
              for path in informational:
                  was, now = at(robot, path), at(new, path)
                  if was != now:
                      print(f"::notice::{robot['id']} {'.'.join(path)}: {was!r} -> {now!r}")

          extra = sorted(set(fresh_by_id) - {r['id'] for r in committed['robots']})
          if extra:
              print(f"::notice::curated but not committed: {extra}")
          sys.exit(1 if drifted else 0)
          PY

      # data/visibility.md is what the site filters on, so a stale row (or a row
      # naming an id that no longer exists) would quietly change what visitors see.
      - name: Check the visibility list
        run: |
          node scripts/build_visibility.mjs --check
          # Keep the pull-request check aligned with the Pages preflight so a
          # missing card image is caught before the change reaches main.
          node scripts/check_registry.mjs --thumbs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The compare page reads the same descriptions a second time — without
      # the meshes — and lines their joints up against each other. This asserts
      # the alignment's invariants rather than its taste: every joint placed
      # once or left over, never dropped and never in two rows at once. It runs
      # before the slow render check because it takes about a minute.
      - name: Compare check
        run: |
          PORT=8081 node scripts/serve.mjs &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://localhost:8081/web/ && break
            sleep 1
          done
          node scripts/check_compare.mjs --base http://localhost:8081

      # One description in each of the four languages the picker reads, handed
      # to the real file input: this is the only check that exercises the xacro
      # expander and three.js' USD parser at all, since nothing in the registry
      # is written in either.
      - name: Local description check
        run: BASE_URL=http://localhost:8081 node scripts/check_custom_local.mjs

      # Loads every robot from the CDN in a real browser, so it is the slow
      # step; it is also the only one that catches a robot that silently stopped
      # rendering.
      - name: Render check
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://localhost:8080/web/ && break
            sleep 1
          done
          node scripts/smoke.mjs --all

      # The zip writer is hand-rolled, so the archives get unpacked and their
      # CRCs verified rather than trusted.
      - name: Download check
        run: node scripts/check_downloads.mjs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-screenshots
          path: .cache/smoke/
          if-no-files-found: ignore
